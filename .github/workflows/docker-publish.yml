name: Build and publish to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Both Repository Variables and Repository Secrets are accepted for these
      # two non-sensitive values to prevent a common setup mistake.
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_IMAGE_INPUT: ${{ vars.DOCKERHUB_IMAGE || secrets.DOCKERHUB_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare and validate Docker Hub settings
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error title=Missing Docker Hub username::Add DOCKERHUB_USERNAME under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error title=Missing Docker Hub token::Add DOCKERHUB_TOKEN under Settings > Secrets and variables > Actions > Secrets. Use a Docker Hub access token, not your account password."
            exit 1
          fi

          if [ -n "$DOCKERHUB_IMAGE_INPUT" ]; then
            image="$DOCKERHUB_IMAGE_INPUT"
          else
            repository_name="${GITHUB_REPOSITORY#*/}"
            image="$DOCKERHUB_USERNAME/$repository_name"
            echo "DOCKERHUB_IMAGE was not set; using $image"
          fi

          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"
          case "$image" in
            http://*|https://*|*:*|*/*/*|/*|*/)
              echo "::error title=Invalid Docker Hub image::Use owner/repository without protocol or tag, for example mtynfhymy83/landing-pardis-book."
              exit 1
              ;;
            */*) ;;
            *)
              echo "::error title=Incomplete Docker Hub image::DOCKERHUB_IMAGE must include the Docker Hub namespace, for example $DOCKERHUB_USERNAME/landing-page."
              exit 1
              ;;
          esac
          echo "DOCKERHUB_IMAGE=$image" >> "$GITHUB_ENV"
          echo "Image to publish: $image:latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (includes TypeScript and Vite build)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: pardis-landing:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Nginx and serve the production build
        run: |
          docker run --rm pardis-landing:ci nginx -t
          docker run -d --name landing-smoke -p 127.0.0.1:8080:80 pardis-landing:ci
          trap 'docker logs landing-smoke; docker rm -f landing-smoke' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:8080/favicon.svg | grep -q '<svg'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Publish the tested image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker tag pardis-landing:ci "$DOCKERHUB_IMAGE:sha-$COMMIT_SHA"
          docker tag pardis-landing:ci "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:sha-$COMMIT_SHA"
          docker push "$DOCKERHUB_IMAGE:latest"
