name: Build and publish to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Missing DOCKERHUB_USERNAME variable'; exit 1; }
          test -n "$DOCKERHUB_IMAGE" || { echo 'Missing DOCKERHUB_IMAGE variable'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN secret'; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (includes TypeScript and Vite build)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: pardis-landing:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Nginx and serve the production build
        run: |
          docker run --rm pardis-landing:ci nginx -t
          docker run -d --name landing-smoke -p 127.0.0.1:8080:80 pardis-landing:ci
          trap 'docker logs landing-smoke; docker rm -f landing-smoke' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:8080/favicon.svg | grep -q '<svg'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker tag pardis-landing:ci "$IMAGE:sha-$COMMIT_SHA"
          docker tag pardis-landing:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-$COMMIT_SHA"
          docker push "$IMAGE:latest"
